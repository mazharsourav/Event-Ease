{% comment %}Review note. Context: review.{% endcomment %}
<figure class="ee-note">
    <span class="ee-tape" aria-hidden="true"></span>
    <span class="ee-stars" role="img" aria-label="{{ review.rating }} out of 5">
        {% for i in "12345" %}<svg viewBox="0 0 24 24" class="{% if forloop.counter <= review.rating %}on{% endif %}" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg>{% endfor %}
    </span>
    <blockquote>
        <p class="ee-note-title">{{ review.title }}</p>
        <p class="ee-note-body">{{ review.content|truncatewords:28 }}</p>
    </blockquote>
    <figcaption>{{ review.user.get_full_name|default:review.user.username }} &middot; {{ review.created_at|date:"j M Y" }}</figcaption>
</figure>
