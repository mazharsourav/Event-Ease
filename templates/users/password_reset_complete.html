{% extends 'base.html' %}
{% load core_tags %}

{% block title %}Password changed &middot; EventEase{% endblock %}

{% block extra_css %}<link rel="stylesheet" href="{% asset 'css/pages/auth.css' %}">{% endblock %}

{% block content %}
<div class="ee-wrap ee-auth">
    <h1 class="ee-h1 ee-auth-title">All set</h1>

    <section class="ee-panel ee-panel--taped ee-stock ee-auth-panel">
        <span class="ee-tape" aria-hidden="true"></span>
        <p class="ee-panel-text">Your password has been changed. Log in with the new one.</p>
        <div class="ee-form-actions">
            <a class="ee-pill ee-pill--ink" href="{% url 'users:login' %}">Log in</a>
        </div>
    </section>
</div>
{% endblock %}
