{% extends 'base.html' %}
{% load core_tags %}

{% block title %}Sign up &middot; EventEase{% endblock %}


{% block extra_css %}<link rel="stylesheet" href="{% asset 'css/pages/auth.css' %}">{% endblock %}

{% block content %}
<div class="ee-wrap ee-auth">
    <h1 class="ee-h1 ee-auth-title">Join in</h1>

    <form method="post" class="ee-form ee-panel ee-panel--taped ee-stock ee-auth-panel">
        <span class="ee-tape" aria-hidden="true"></span>
        {% csrf_token %}
        <div class="ee-form-row">
            <div class="ee-form-field">
                <label class="ee-form-label" for="first_name">First name</label>
                <input type="text" id="first_name" name="first_name" value="{{ request.POST.first_name }}" autocomplete="given-name" required autofocus>
            </div>
            <div class="ee-form-field">
                <label class="ee-form-label" for="last_name">Last name</label>
                <input type="text" id="last_name" name="last_name" value="{{ request.POST.last_name }}" autocomplete="family-name" required>
            </div>
        </div>
        <div class="ee-form-field">
            <label class="ee-form-label" for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ request.POST.username }}" autocomplete="username" required>
        </div>
        <div class="ee-form-field">
            <label class="ee-form-label" for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ request.POST.email }}" autocomplete="email" required>
        </div>
        <div class="ee-form-row">
            <div class="ee-form-field">
                <label class="ee-form-label" for="password1">Password</label>
                <input type="password" id="password1" name="password1" minlength="8" autocomplete="new-password" required>
                <p class="ee-form-help">At least 8 characters.</p>
            </div>
            <div class="ee-form-field">
                <label class="ee-form-label" for="password2">Confirm password</label>
                <input type="password" id="password2" name="password2" autocomplete="new-password" required>
            </div>
        </div>
        <div class="ee-form-actions">
            <button type="submit" class="ee-pill ee-pill--ink">Create account</button>
        </div>
    </form>

    <p class="ee-auth-switch">Already have an account? <a href="{% url 'users:login' %}">Log in</a></p>
</div>
{% endblock %}

{% block extra_js %}<script src="{% asset 'js/pages/auth.js' %}" defer></script>{% endblock %}
